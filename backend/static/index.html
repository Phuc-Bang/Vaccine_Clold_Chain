<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccine Cold Chain | Premium Dashboard</title>

    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=2.0">
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="brand">
                <i class="fa-solid fa-snowflake fa-2x" style="color: var(--neon-blue)"></i>
                <div class="brand-text">
                    <h1>ColdChain<span style="font-weight: 300; opacity: 0.7">Monitor</span></h1>
                </div>
            </div>
            <div class="status-check online" id="connectionStatus">
                <div class="dot"></div>
                <span>System Online</span>
            </div>
        </header>

        <!-- DASHBOARD GRID -->
        <div class="dashboard">

            <!-- TEMP & HUMIDITY (Left Col) -->
            <div class="glass-card col-4">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-temperature-half"></i> Realtime Sensor</div>
                </div>
                <div class="metric-box">
                    <div class="metric-value" id="currentTemp">--<span class="metric-unit">°C</span></div>
                    <div class="metric-sub">Độ Ẩm: <span id="currentHumidity">--%</span></div>
                </div>
                <div style="padding: 1rem; text-align: center; opacity: 0.7; font-size: 0.9rem;">
                    <i class="fa-solid fa-shield-virus"></i> Safe Zone: 20°C - 30°C
                </div>
            </div>

            <!-- CHART (Right Col) -->
            <div class="glass-card col-8">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-chart-line"></i> Nhiệt Độ Theo Thời Gian</div>
                </div>
                <div style="height: 250px; padding: 0 1rem;">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- STATUS & CONTROLS -->
            <div class="glass-card col-4">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-server"></i> Trạng Thái Thiết Bị</div>
                </div>
                <div style="padding: 1rem;">
                    <div class="status-pill active" id="coolerStatus">
                        <div>
                            <div style="font-weight: 700;">Máy Lạnh</div>
                            <small>Backup System</small>
                        </div>
                        <i class="fa-solid fa-fan fa-xl"></i>
                    </div>
                    <div class="status-pill" id="alarmStatus">
                        <div>
                            <div style="font-weight: 700;">Còi Báo Động</div>
                            <small>Security Alert</small>
                        </div>
                        <i class="fa-regular fa-bell fa-xl"></i>
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="glass-card col-4">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-gamepad"></i> Điều Khiển</div>
                </div>
                <div style="padding: 1rem;">
                    <button id="btnCooler" class="btn-control btn-primary">
                        <i class="fa-solid fa-power-off"></i> Bật Máy Lạnh Dự Phòng
                    </button>
                    <button id="btnAlarm" class="btn-control btn-danger">
                        <i class="fa-solid fa-bell-slash"></i> Tắt Còi Báo Động
                    </button>
                    <div id="controlFeedback"
                        style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 10px;">
                        Ready for command...
                    </div>
                </div>
            </div>

            <!-- ALERTS & LOGS -->
            <div class="glass-card col-4">
                <div class="card-header">
                    <div class="card-title"><i class="fa-solid fa-triangle-exclamation"></i> Cảnh Báo & Logs</div>
                </div>
                <div style="padding: 0 1rem 1rem 1rem;">
                    <div id="alertList" class="alert-box">
                        <!-- Alerts will appear here -->
                    </div>
                    <div id="logContainer" class="log-terminal">
                        <div class="log-line"><span>></span> System Initialized...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/chart.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
