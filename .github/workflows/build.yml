name: Build Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        run: |
          docker build -t vaccine-backend:${{ github.sha }} backend/
          docker tag vaccine-backend:${{ github.sha }} vaccine-backend:latest

      - name: Test Backend Image
        run: |
          docker run --rm vaccine-backend:${{ github.sha }} python -m pytest

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag vaccine-backend:latest ${{ secrets.DOCKER_USERNAME }}/vaccine-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vaccine-backend:latest
