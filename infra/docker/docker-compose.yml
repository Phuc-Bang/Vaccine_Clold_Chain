version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: vaccine_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - vaccine_net

  backend:
    build: ./backend
    container_name: vaccine_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    networks:
      - vaccine_net

networks:
  vaccine_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
